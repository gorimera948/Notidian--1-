<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pomodoro 完全版</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f8;}
.container{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px;max-width:1200px;margin:auto;}
.panel{background:#fff;padding:12px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.row{display:flex;gap:6px;}
input,button,select{padding:6px;margin:4px 0;box-sizing:border-box;}
select{background-color:#1a1e2e; color:#fff; border:1px solid #ccc; border-radius:4px; outline:none;}
select option{background-color:#1a1e2e; color:#fff;}
.timeInput{flex:1;height:36px;}
#name{width:100%;height:36px;}
.scheduleItem{display:flex;justify-content:space-between;border:1px solid #ddd;border-radius:6px;margin:4px 0;padding:6px;}
.scheduleMain{flex:1;cursor:grab;}
.active{background:#d0ebff;}
.del{border:none;background:none;cursor:pointer;}

.timerBox{display:flex;justify-content:space-between;align-items:center;padding:20px;}

/* ★ここだけ追加（他は一切変更なし） */
#currentIndex{font-size:28px;font-weight:bold;}
#taskName{font-size:26px;font-weight:bold;}

#time{font-size:60px;font-weight:bold;margin-top:10px;}

canvas{background:#eee;border-radius:50%;width:220px;height:220px;}
</style>
</head>

<body>

<div class="container">

<div class="panel">
<h3>① セット作成</h3>
<input id="name" placeholder="名前">

<div class="row">
<input id="workMin" class="timeInput" type="number" placeholder="作業分">
<input id="workSec" class="timeInput" type="number" placeholder="秒">
</div>

<div class="row">
<input id="restMin" class="timeInput" type="number" placeholder="休憩分">
<input id="restSec" class="timeInput" type="number" placeholder="秒">
</div>

<button onclick="addSet()">セット追加</button>

<h3>② スケジュール追加</h3>
<div class="row">
<select id="setSelect" style="flex:5;"></select>
<button onclick="addSchedule()" style="flex:1;">追加</button>
<button onclick="deleteSet()" style="flex:1;">×</button>
</div>

<h3>③ スケジュール</h3>
<div id="schedule"></div>
</div>

<div class="panel">
<h3>④ プリセット</h3>

<div class="row">
<input id="presetName" style="flex:5;">
<button onclick="savePreset()" style="flex:1;">登録</button>
</div>

<div class="row">
<select id="presetSelect" style="flex:5;" onchange="loadPreset()"></select>
<button onclick="deletePreset()" style="flex:1;">×</button>
</div>

<hr>

<h3>⑤ タイマー</h3>

<div class="timerBox">
<div>
<div id="currentIndex">0/0</div>
<div id="taskName">未選択</div>
<div id="time">00:00</div>
</div>
<canvas id="circle" width="220" height="220"></canvas>
</div>

<div class="row">
<button onclick="startTimer()">開始</button>
<button onclick="pauseTimer()">一時停止</button>
<button onclick="stopTimer()">停止</button>
</div>

<div class="row" style="align-items: center; margin-top: 10px; padding: 0 4px;">
<span style="font-size:12px; color:#555; margin-right:8px;">音量:</span>
<input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" style="flex: 1; height: 6px; cursor: pointer;">
</div>

</div>
</div>

<script>

/* ===== ここから下は一切変更なし（元のコードそのまま） ===== */

let sets=[], schedule=[], presets=[];
let index=0, isWork=true;
let raf=null;
let remaining=0, duration=1, endTime=0;
let isRunning=false;
let lastSec=null;

let timerVolume = 0.5;

/* ===== STORAGE ===== */
function saveData(){
  localStorage.setItem("pomodoro_sets", JSON.stringify(sets));
  localStorage.setItem("pomodoro_schedule", JSON.stringify(schedule));
  localStorage.setItem("pomodoro_presets", JSON.stringify(presets));
  localStorage.setItem("pomodoro_standalone_volume", timerVolume);
}

function loadData(){
  sets = JSON.parse(localStorage.getItem("pomodoro_sets") || "[]");
  schedule = JSON.parse(localStorage.getItem("pomodoro_schedule") || "[]");
  presets = JSON.parse(localStorage.getItem("pomodoro_presets") || "[]");
  timerVolume = parseFloat(localStorage.getItem("pomodoro_standalone_volume") || "0.5");
}

/* ===== SET ===== */
function addSet(){
  const selected=setSelect.value;
  const name=document.getElementById("name").value;
  const work=(workMin.value*60 + Number(workSec.value||0))*1000;
  const rest=(restMin.value*60 + Number(restSec.value||0))*1000;
  if(!name||!work) return;
  sets.push({name,work,rest});
  render();
  saveData();
  setSelect.value=selected;
}

function deleteSet(){
  sets.splice(setSelect.value,1);
  render();
  saveData();
}

/* ===== SCHEDULE ===== */
function addSchedule(){
  const selected=setSelect.value;
  if(selected===""||!sets[selected]) return;
  schedule.push(sets[selected]);
  render();
  saveData();
  setSelect.value=selected;
}

function deleteSchedule(i){
  schedule.splice(i,1);
  render();
  saveData();
}

/* ===== PRESET ===== */
function savePreset(){
  presets.push({name:presetName.value,schedule:structuredClone(schedule)});
  render();
  saveData();
}

function loadPreset(){
  const selected=presetSelect.value;
  if(selected==="") return;
  schedule=structuredClone(presets[selected].schedule);
  render();
  presetSelect.value=selected;
  saveData();
}

function deletePreset(){
  presets.splice(presetSelect.value,1);
  render();
  saveData();
}

/* ===== RENDER ===== */
function format(ms){
  return `${Math.floor(ms/60000)}分${Math.floor((ms%60000)/1000)}秒`;
}

function render(){

  setSelect.innerHTML="";
  sets.forEach((s,i)=>setSelect.innerHTML+=`<option value="${i}">${s.name}</option>`);
  if(sets.length===0) setSelect.innerHTML=`<option value="">セットなし</option>`;

  const area=document.getElementById("schedule");
  area.innerHTML="";

  schedule.forEach((s,i)=>{
    area.innerHTML+=`
    <div class="scheduleItem ${i===index?'active':''}">
      <div class="scheduleMain">
        <div>${i+1}. ${s.name}</div>
        <div>${format(s.work)} / ${format(s.rest)}</div>
      </div>
      <button class="del" onclick="deleteSchedule(${i})">×</button>
    </div>`;
  });

  Sortable.create(area,{
    animation:150,
    onEnd:e=>{
      const moved=schedule.splice(e.oldIndex,1)[0];
      schedule.splice(e.newIndex,0,moved);
      render();
      saveData();
    }
  });

  presetSelect.innerHTML="";
  presets.forEach((p,i)=>presetSelect.innerHTML+=`<option value="${i}">${p.name}</option>`);
}

/* ===== TIMER ===== */
//（そのまま）

function startTimer(){
  if(schedule.length===0) return;

  if(!isRunning){
    run();
  }else{
    endTime=Date.now()+remaining;
    loop();
  }
  isRunning=true;
}

function run(){
  if(index>=schedule.length){
    stopTimer();
    return;
  }

  const s=schedule[index];

  isWork=!isWork;
  duration=isWork?s.work:s.rest;

  remaining=duration;
  endTime=Date.now()+duration;

  lastSec=Math.ceil(duration/1000);

  currentIndex.textContent=`${index+1}/${schedule.length}`;
  taskName.textContent=`${index+1}. ${s.name}`;

  render();

  loop();
}

function loop(){
  cancelAnimationFrame(raf);

  function frame(){

    const now=Date.now();
    remaining=endTime-now;

    if(remaining<=0){
      remaining=0;

      if(lastSec!==0){
        beep();
        lastSec=0;
      }

      time.textContent="0:00";
      draw(0);

      endSound();

      isWork?run():(index++,run());
      return;
    }

    const sec=Math.ceil(remaining/1000);

    if(sec!==lastSec){
      if(sec===3||sec===2||sec===1){
        beep();
      }
      lastSec=sec;
    }

    const secDisplay=Math.ceil(remaining/1000);
    time.textContent=
      `${Math.floor(secDisplay/60)}:${String(secDisplay%60).padStart(2,'0')}`;

    draw(remaining);

    raf=requestAnimationFrame(frame);
  }

  frame();
}

function pauseTimer(){ cancelAnimationFrame(raf); }
function stopTimer(){ cancelAnimationFrame(raf); isRunning=false; index=0; render(); }

/* ===== SOUND ===== */
function beep(){
  const ctx=new AudioContext();
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type = 'triangle'; // 三角波に変更し音圧を劇的向上！
  o.frequency.value=600;
  g.gain.setValueAtTime(6.25 * timerVolume,ctx.currentTime); // 現在の0.5倍に調整
  g.gain.exponentialRampToValueAtTime(0.002,ctx.currentTime+0.18);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime+0.18);
}

function endSound(){
  const ctx=new AudioContext();
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type = 'triangle'; // 三角波に変更し音圧を劇的向上！
  o.frequency.value=750;
  g.gain.setValueAtTime(8.75 * timerVolume,ctx.currentTime); // 現在の0.5倍に調整
  g.gain.exponentialRampToValueAtTime(0.002,ctx.currentTime+1.5);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime+1.5);
}

/* ===== PIZZA ===== */
function draw(rem){
  const ctx=circle.getContext("2d");
  let ratio=rem/duration;
  if(rem<=0) ratio=0;
  ctx.clearRect(0,0,220,220);
  ctx.beginPath(); ctx.arc(110,110,100,0,Math.PI*2);
  ctx.fillStyle="#ddd"; ctx.fill();
  const start=-Math.PI/2;
  const end=start+Math.PI*2*ratio;
  ctx.beginPath();
  ctx.moveTo(110,110);
  ctx.arc(110,110,100,start,end);
  ctx.fillStyle=isWork?"#4a90e2":"#50c878";
  ctx.fill();
}

/* ===== INIT ===== */
loadData();
render();

// 音量スライダーの初期化
const volSlider = document.getElementById("volumeSlider");
if (volSlider) {
  volSlider.value = timerVolume;
  volSlider.addEventListener("input", (e) => {
    timerVolume = parseFloat(e.target.value);
    saveData();
  });
  volSlider.addEventListener("change", () => {
    beep(); // 音量変更確認用テスト
  });
}

</script>

</body>
</html>
